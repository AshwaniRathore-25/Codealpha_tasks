<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Projects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            padding: 50px 30px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 35px;
            opacity: 0.85;
        }

        .projects {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        a {
            display: block;
            padding: 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.25);
        }

        .footer {
            margin-top: 35px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CodeAlpha Projects</h1>

        <p>My Web Development Internship Projects</p>

        <div class="projects">

            <a href="./Calculator/">
                🧮 Calculator
            </a>

            <a href="./Music%20Player/">
                🎵 Music Player
            </a>

            <a href="./Portfolio/">
                💼 Portfolio
            </a>

        </div>

        <div class="footer">
            CodeAlpha Web Development Internship
        </div>

    </div>

</body>
</html>
